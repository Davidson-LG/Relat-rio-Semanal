name: Relatorio semanal - Mercado em Destaque

on:
  schedule:
    - cron: "0 12 * * 1" # segunda-feira, 09:00 BRT (12:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/pipeline.py

      - name: Commitar dados atualizados
        run: |
          git config user.name "mercado-em-destaque-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history/
          git diff --cached --quiet || git commit -m "Atualizacao semanal - $(date +%d/%m/%Y)"
          git push
